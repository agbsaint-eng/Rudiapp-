const head=()=>`<div class="c hd"><img class="lg" src="${LOGO}" alt="رودی"></div>`;
const sb=()=>`<div class="c sc"><span id="s0">${E(G.tm[0].n)}: ${G.tm[0].sc}</span><span id="s1">${E(G.tm[1].n)}: ${G.tm[1].sc}</span></div>`;
const N=v=>+String(v).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632);
function setSt(v,k,x){const n=N(x);if(x!==''&&!isNaN(n)&&n>0){cfg.st[v][k]=n;save()}}
const poP=l=>{const i=l.lastIndexOf('|');return i<0?{t:l,s:''}:{t:l.slice(0,i),s:l.slice(i+1).trim()}};
const poH=l=>poP(l).t.split('/').map(x=>E(x.trim())).filter(Boolean).join('<br>');
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

function home(){clearInterval(G&&G.iv);app().innerHTML=head()+`<div class="c">نوع بازی را انتخاب کنید</div>`+cfg.pre.map((p,i)=>`<div class="c"><h3>${E(p.n)}</h3><p>${p.s.map(id=>E(SN[id])).join(' · ')}</p><button class="b" onclick="setup(${i})">انتخاب</button></div>`).join('')+`<footer>رودی | rudiapp.ir · </footer><button class="b g" onclick="A.v=0;A.k=null;adm()">⚙ پنل مدیریت</button>`}
function setup(i){const g=k=>`<div class="c"><b>${k?'گروه دوم':'گروه اول'}</b><input id="n${k}" placeholder="نام گروه را بنویسید"></div>`;
app().innerHTML=head()+`<div class="c"><h3>${E(cfg.pre[i].n)}</h3><p>${cfg.pre[i].s.map(id=>E(SN[id])).join(' · ')}</p></div>`+g(0)+g(1)+`<button class="b" onclick="start(${i})">ادامه</button><button class="b g" onclick="home()">← بازگشت</button>`}
function start(i){const n=[0,1].map(k=>$('#n'+k).value.trim()||'گروه '+(k+1));
G={tm:[0,1].map(k=>({n:n[k],sc:0,cu:new Set()})),all:cfg.pre[i].s,ids:[],done:new Set(),si:0,pl:[5,5],us:new Set(),used:new Set(),ru:{4:new Set(),5:new Set()}};hub()}
function hub(){clearInterval(G.iv);G.act=0;app().innerHTML=head()+sb()+`<div class="c">یک مرحله را انتخاب کنید</div><div class="grid">${G.all.map(id=>`<button class="${G.done.has(id)?'g':''}" style="padding:24px 8px" ${G.done.has(id)?'disabled':''} onclick="run(${id})">${G.done.has(id)?'✅ ':''}${E(SN[id])}</button>`).join('')}</div><button class="b g" onclick="fin()">پایان بازی و اعلام برنده</button>`}
function run(id){G.act=1;G.cur=null;G.ids=[id];G.si=0;intro()}
function intro(){const sid=G.sid=G.ids[G.si],id=G.id=sid==7?4:sid,q=G.q=[];
const R=(id==3||id==6)?1:Math.max(1,+cfg.st[sid].r||1);for(let i=0;i<R;i++)q.push({t:0,b:sid==7},{t:1,b:sid==7});
G.qi=0;app().innerHTML=head()+sb()+`<div class="c"><h2>${SN[sid]}</h2><p>${RULE[sid]}</p></div>${(sid==3||sid==6)?`<div class="c"><b>تعداد بازیکنان این مرحله</b>${G.tm.map((t,k)=>`<label>${E(t.n)}</label><input id="pl${k}" type="text" inputmode="numeric" data-n="1" value="${cfg.st[sid].n||5}">`).join('')}</div>`:''}<button class="b" onclick="begin()">شروع مرحله</button>`}
function begin(){if(G.sid==3||G.sid==6)G.pl=[0,1].map(k=>Math.max(1,Math.min(50,+$('#pl'+k).value||5)));turn()}
function turn(){if(G.qi>=G.q.length){G.act=0;G.si++;G.done.add(G.ids[0]);return hub()}
const q=G.q[G.qi],id=G.id,S=cfg.st[id],c=G.cur={t:q.t,b:q.b,chk:[],sc:0,i:0,k:G.qi};
if(id==1)return pickCat();
if(id==2)c.w=secW();else if(id==3)c.w=many(wl(3),G.pl[c.t]);else if(id==6)c.w=secW6(Math.max(5,Math.min(9,G.pl[c.t]-1)));
else if(id==8)c.w=[pickW(cfg.po)];else if(id==4)c.w=[pickW(pool().concat(cfg.sent))];else c.w=[pickW(wl(5))];
handoff(id==5||(id==4&&c.b)?'restr()':'play()')}
function secW(){ESP();const f=()=>cfg.sp.map((a,i)=>i).filter(i=>cfg.sp[i].length&&!G.us.has(i));let av=f();if(!av.length){G.us.clear();av=f()}if(!av.length){const r=repW(SN[2]);return r.length>=8?many(r,8):many(pool(),8)}const i=sh(av);G.us.add(i);const w=cfg.sp[i].slice(0,8);w.forEach(x=>mark(x,cfg.sp[i]));return w}
function handoff(fn){app().innerHTML=head()+sb()+`<div class="c"><h3>گوشی را به اجراکننده بدهید</h3><p>نوبت ${E(G.tm[G.cur.t].n)}${G.cur.b?' · بخش با محدودیت':''}</p></div><button class="b" onclick="${fn}">نمایش کلمه</button>`}
function pickCat(){const c=G.cur,tm=G.tm[c.t],av=Object.keys(cfg.cats).map((k,i)=>[k,i]).filter(x=>!tm.cu.has(x[0]));
if(!av.length){G.qi++;return turn()}
app().innerHTML=head()+sb()+`<div class="c">نوبت <b>${E(tm.n)}</b> · دسته را انتخاب کنید</div><div class="grid">${av.map(x=>`<button onclick="lvl(${x[1]})">${E(x[0])}</button>`).join('')}</div>`}
function lvl(i){const k=Object.keys(cfg.cats)[i],p=cfg.cats[k].p;app().innerHTML=head()+sb()+`<div class="c">دسته: <b>${E(k)}</b></div><button class="b" onclick="go(${i},0)">آسان (${p[0]} امتیاز)</button><button class="b" onclick="go(${i},1)">سخت (${p[1]} امتیاز)</button>`}
function go(i,l){const k=Object.keys(cfg.cats)[i],c=G.cur;G.tm[c.t].cu.add(k);c.pts=cfg.cats[k].p[l];c.w=[pickW(cfg.cats[k][l?'h':'e'])];handoff('play()')}
function restr(){const c=G.cur,id=G.id,L=id==4?cfg.rA:cfg.rP,u=G.ru[id];
if(u.size>=L.length)u.clear();
G.opt=L;const av=L.map((r,k)=>k).filter(k=>!u.has(k));
app().innerHTML=head()+sb()+`<div class="c"><p>یک شماره انتخاب کنید تا محدودیت مشخص شود</p></div><div class="ng">${av.map(k=>`<button onclick="rs(${k})">${k+1}</button>`).join('')}</div>`}
function rs(k){const c=G.cur;G.ru[G.id].add(k);c.r=G.opt[k];c.rn=k+1;ready()}
function ready(){const c=G.cur;app().innerHTML=head()+sb()+`<div class="c"><h3>محدودیت ${c.rn}</h3><p class="big">${E(c.r)}</p><p>شرایط را برای اجراکننده فراهم کنید. با زدن دکمه، لغت نمایش داده می‌شود و تایمر شروع می‌شود.</p></div><button class="b" onclick="play()">نمایش لغت و شروع تایمر</button>`}
function play(){unlock();const c=G.cur,id=G.id,S=cfg.st[G.sid];c.T=id==3?0:S.t;c.P=id==1?c.pts:S.p;c.left=c.T;draw();clearInterval(G.iv);
if(c.T)G.iv=setInterval(()=>{c.left--;const e=$('#tm');if(e)e.textContent=fmt(c.left);if(c.left<=0){clearInterval(G.iv);cfg.bell===0?alarm():horn();done(false)}},1000)}
function draw(){const c=G.cur,id=G.id;let h=head()+sb()+'<div class="c">'+(c.T?`<div class="t" id="tm">${fmt(c.left)}</div>`:'')+(c.r?`<p>محدودیت ${c.rn}: <b>${E(c.r)}</b></p>`:'')+'</div>';
if(id==2||id==6)h+=c.w.map((w,i)=>`<label class="c" style="display:block"><input type="checkbox" style="width:auto" ${c.chk[i]?'checked':''} onchange="G.cur.chk[${i}]=this.checked"> ${E(w)}</label>`).join('')+`<button class="b" onclick="done(true)">پایان</button>`;
else if(id==3)h+=`<div class="c"><div class="big">${E(c.w[c.i])}</div><p>کلمه ${c.i+1} از ${c.w.length}</p></div><button class="b" onclick="rel(1)">✅ حدس زدند</button><button class="b g" onclick="rel(0)">⏭ رد کردن</button>`;
else if(id==8)h+=`<div class="c"><div id="wd" style="text-align:center;font-size:20px;font-weight:700;line-height:2.2;color:var(--pr)">${c.hid?'•••':poH(c.w[0])}</div></div><button class="b g" onclick="tog()">نمایش / پنهان</button><button class="b" onclick="done(true)">✅ حدس زدند</button>`;
else h+=`<div class="c"><div class="big" id="wd">${c.hid?'•••':E(c.w[0])}</div></div><button class="b g" onclick="tog()">نمایش / پنهان</button><button class="b" onclick="done(true)">✅ حدس زدند</button>`;
app().innerHTML=h}
function tog(){const c=G.cur;c.hid=!c.hid;if(G.id==8)$('#wd').innerHTML=c.hid?'•••':poH(c.w[0]);else $('#wd').textContent=c.hid?'•••':c.w[0]}
function rel(g){const c=G.cur;if(g)c.sc+=c.P;c.i++;if(c.i>=c.w.length)return done(true);app().innerHTML=head()+sb()+`<div class="c"><h3>نفر بعدی</h3><p>گوشی را به نفر بعدی بدهید</p></div><button class="b" onclick="draw()">نمایش کلمه</button>`}
function done(ok){clearInterval(G.iv);G.pn=[0,0];const c=G.cur,id=G.id,t=G.tm[c.t];
const el=c.T?c.T-c.left:99,bn=ok&&c.T&&[1,4,5,7,8].includes(G.sid)?(el<15?2:el<30?1:0):0;
const pts=(id==2||id==6?c.chk.filter(Boolean).length*c.P:id==3?c.sc:ok?c.P:0)+bn;t.sc+=pts;G.qi++;
app().innerHTML=head()+sb()+`<div class="c"><p>${ok?'✅':'⏰ وقت تمام شد'} ${E(t.n)}: ${pts} امتیاز</p>${bn?`<p>🎁 امتیاز تشویقی سرعت: +${bn} (حدس در ${el} ثانیه)</p>`:''}${id==8?`<p style="line-height:2">${poH(c.w[0])}</p>${poP(c.w[0]).s?`<p>پاسخ: <b>${E(poP(c.w[0]).s)}</b></p>`:''}`:`<p>کلمه: ${c.w.map(E).join('، ')}</p>`}</div><div class="c"><b>خطای بازیکن</b><p>اگر بازیکنی کار ممنوعی انجام داد، برای گروه او یک امتیاز منفی ثبت کنید.</p><button class="b g" onclick="pen(${c.t})">⚠️ ${E(G.tm[c.t].n)} (−۱)</button><p id="pn"></p></div><button class="b" onclick="turn()">ادامه</button>`}
let AC;const unlock=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}};
function horn(){try{navigator.vibrate&&navigator.vibrate([600,150,600,150,600]);unlock();const a=AC,g=a.createGain();g.gain.value=.7;g.connect(a.destination);[0,.8,1.6].forEach(d=>{const o=a.createOscillator();o.type='sawtooth';o.frequency.value=330;o.connect(g);o.start(a.currentTime+d);o.stop(a.currentTime+d+.6)})}catch(e){}}
function alarm(){try{navigator.vibrate&&navigator.vibrate([300,100,300]);const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();setTimeout(()=>o.stop(),500)}catch(e){}}
function pen(k){G.pn=G.pn||[0,0];G.tm[k].sc-=1;G.pn[k]++;const e=$('#s'+k);if(e)e.textContent=G.tm[k].n+': '+G.tm[k].sc;
const m=$('#pn');if(m)m.textContent=[0,1].filter(i=>G.pn[i]).map(i=>'امتیاز منفی '+G.tm[i].n+': −'+G.pn[i]).join(' · ')}
function fin(){const[a,b]=G.tm;app().innerHTML=head()+`<div class="c"><h2>🏆 پایان بازی</h2><p>${E(a.n)}: ${a.sc}</p><p>${E(b.n)}: ${b.sc}</p><h3>${a.sc==b.sc?'مساوی شد! 🤝':'برنده: '+E((a.sc>b.sc?a:b).n)}</h3></div><button class="b" onclick="home()">بازی دوباره</button><footer>رودی | rudiapp.ir</footer>`}

/* ---------- پنل مدیریت ---------- */
const FL={r:'تعداد نفرات',t:'زمان (ثانیه)',p:'امتیاز',n:'تعداد کلمه',t2:'زمان بخش با محدودیت',p2:'امتیاز بخش با محدودیت'};
const lines=id=>$(id).value.split('\n').map(s=>s.trim()).filter(Boolean);
const ta=(id,l,v,hl)=>`<label>${l}</label><textarea id="${id}" rows="9">${E(v.join('\n'))}</textarea>`;
function adm(){const v=A.v||0,ks=Object.keys(cfg.cats);
ESP();ESP6();let h=`<div class="c"><b>پنل مدیریت</b> · <a href="#" onclick="event.preventDefault();home();return false">بازگشت به بازی</a></div>`;
if(!v)h+=`<div class="grid">${Object.keys(SN).map(id=>`<button style="padding:24px 8px" onclick="A.v=${id};adm()">${id}. ${SN[id]}</button>`).join('')}</div><button class="b g" onclick="A.v='pre';adm()">گروه‌های بازی (مرحله‌های هر نوع)</button><button class="b g" onclick="A.v='misc';adm()">پشتیبان</button><button class="b g" onclick="A.v='log';adm()">گزارش خطاها (${logGet().length})</button><button class="b g" onclick="A.v='rep';adm()">مخزن لغات استفاده‌شده (${repAll().length})</button><button class="b g" onclick="cfg.bell=cfg.bell===0?1:0;save();adm()">بوق پایان زمان: ${cfg.bell===0?'خاموش':'روشن'}</button>`;
else{h+=`<button class="g" onclick="${v==1&&A.k!=null?'A.k=null':((v==2||v==6)&&A.s!=null)?'A.s=null':'A.v=0;A.k=null;A.s=null'};armed=0;adm()">← بازگشت</button>`;
if(typeof v=='number'){h+=`<div class="c"><h2>${E(SN[v])}</h2><label>نام مرحله (در صفحه اول دیده می‌شود)</label><input value="${E(SN[v])}" oninput="cfg.nm=cfg.nm||{};cfg.nm[${v}]=this.value;SN[${v}]=this.value;save()" onchange="cfg.nm=cfg.nm||{};cfg.nm[${v}]=this.value;SN[${v}]=this.value;save()">${Object.keys(cfg.st[v]).filter(k=>!(v==2&&k=='n')).map(k=>`<label>${(v==3||v==6)&&k=='n'?'تعداد نفرات':FL[k]}</label><input type="text" inputmode="numeric" data-n="1" value="${cfg.st[v][k]}" oninput="setSt(${v},'${k}',this.value)" onchange="setSt(${v},'${k}',this.value)">`).join('')}</div>`;
if(v==1){if(A.k==null)h+=`<div class="grid">${ks.map((k,i)=>`<button class="g" onclick="A.k=${i};adm()">${E(k)} (${cfg.cats[k].e.length+cfg.cats[k].h.length})</button>`).join('')}</div>`;
else{const k=ks[A.k],c=cfg.cats[k];h+=`<div class="c"><h3>${E(k)}</h3><label>امتیاز آسان / سخت</label><div class="grid"><input id="pa" type="text" inputmode="numeric" data-n="1" value="${c.p[0]}"><input id="pb" type="text" inputmode="numeric" data-n="1" value="${c.p[1]}"></div>${ta('te','لغت‌های آسان (هر خط یک مورد)',c.e,1)}${ta('th','لغت‌های سخت',c.h,1)}<button class="b" onclick="svc(${A.k})">ذخیره</button></div>`}}
else if(v==4||v==7)h+=`<div class="c">${ta('ts','جمله‌های نقاشی (علاوه بر لغت‌های دسته‌ها)',cfg.sent,1)}${v==7?ta('ra','محدودیت‌های نقاشی',cfg.rA):''}<button class="b" onclick="svs()">ذخیره</button></div>`;
else if(v==5)h+=`<div class="c">${ta('wl','لغت‌های این مرحله (هر خط یک لغت)',wl(5),1)}${ta('rp','محدودیت‌ها',cfg.rP)}<button class="b" onclick="svp()">ذخیره</button></div>`;
else if(v==2)h+=(A.s==null?`<div class="c"><b>۲۰ قسمت لغت</b><p>هر قسمت ۸ لغت دارد. در هر نوبت یکی از قسمت‌های پر به‌صورت تصادفی انتخاب می‌شود.</p></div><div class="grid">${cfg.sp.map((a,i)=>`<button class="${a.length?'':'g'}" onclick="A.s=${i};adm()">قسمت ${i+1} (${a.length}/8)</button>`).join('')}</div>`:`<div class="c"><h3>قسمت ${A.s+1}</h3>${ta('sw','لغت‌ها (هر خط یک لغت، حداکثر ۸ لغت)',cfg.sp[A.s],1)}<button class="b" onclick="svsec(${A.s})">ذخیره</button></div>`);
else if(v==6)h+=(A.s==null?`<div class="c"><b>۲۰ قسمت لغت اسپیکر</b><p>هر قسمت تا ۹ لغت دارد (مستقل از مرحله سرعتی). در هر نوبت یک قسمت پر به‌صورت تصادفی انتخاب می‌شود و بسته به تعداد بازیکن ۵ تا ۹ لغت اول آن نشان داده می‌شود (تعداد بازیکن منهای ۱). اگر همه قسمت‌ها خالی باشند، از لغت‌های پیش‌فرض عمومی همین مرحله استفاده می‌شود.</p></div><div class="grid">${cfg.sp6.map((a,i)=>`<button class="${a.length?'':'g'}" onclick="A.s=${i};adm()">قسمت ${i+1} (${a.length}/9)</button>`).join('')}</div>`:`<div class="c"><h3>قسمت ${A.s+1}</h3>${ta('sw','لغت‌ها (هر خط یک لغت، حداکثر ۹ لغت)',cfg.sp6[A.s],1)}<button class="b" onclick="svsec6(${A.s})">ذخیره</button></div>`);
else if(v==8)h+=`<div class="c"><p>هر خط یک مورد: مصرع‌ها را با / از هم جدا کنید (دو بیت = چهار مصرع)، سپس | و نام شاعر/خواننده/آهنگ.</p>${ta('po','شعرها',cfg.po,1)}<button class="b" onclick="svpo()">ذخیره</button></div>`;
else h+=`<div class="c">${ta('wl','لغت‌های این مرحله (هر خط یک لغت)',wl(v),1)}<button class="b" onclick="svw(${v})">ذخیره</button></div>`}
else if(v=='log')h+=logUI(); else if(v=='rep')h+=repUI();
else if(v=='pre')h+=cfg.pre.map((p,pi)=>`<div class="c"><input value="${E(p.n)}" oninput="cfg.pre[${pi}].n=this.value;save()" onchange="cfg.pre[${pi}].n=this.value;save()">`+p.s.map((id,j)=>`<div>${SN[id]} <button class="g" onclick="mv(${pi},${j},-1)">↑</button><button class="g" onclick="mv(${pi},${j},1)">↓</button><button class="g" onclick="rm(${pi},${j})">✕</button></div>`).join('')+Object.keys(SN).filter(id=>!p.s.includes(+id)).map(id=>`<button class="g" onclick="ad(${pi},${id})">+ ${SN[id]}</button>`).join('')+`<div><button class="${cfg.def==pi?'':'g'}" onclick="cfg.def=${pi};save();adm()">پیش‌فرض</button>${cfg.pre.length>1?`<button class="g" onclick="dp(${pi})">حذف</button>`:''}</div></div>`).join('')+`<button class="b" onclick="cfg.pre.push({n:'پیش‌تنظیم جدید',s:[1,2,3,4,5,6]});save();adm()">+ پیش‌تنظیم جدید</button>`;
else h+=`<div class="c"><b>پشتیبان</b><p>این متن را کپی و جایی نگه دارید. برای بازیابی، متن را اینجا بچسبانید.</p><textarea id="bk" rows="6">${E(JSON.stringify({...cfg,logo:''}))}</textarea><button class="b" onclick="rs2()">بازیابی از متن</button><button class="b g" onclick="rz()">${armed?'مطمئنی؟ دوباره بزن':'بازگشت به پیش‌فرض'}</button></div>`}
app().innerHTML=h}
function svc(i){const c=cfg.cats[Object.keys(cfg.cats)[i]];c.e=lines('#te');c.h=lines('#th');c.p=[+$('#pa').value,+$('#pb').value];save();adm()}
function repUI(){const r=REPK(),ks=repKeys();
return `<div class="c"><h2>مخزن لغات استفاده‌شده</h2><p>لغتی که در بازی استفاده شود از لیست اصلی حذف و اینجا نگه‌داری می‌شود.</p></div>`+(ks.length?ks.map((k,i)=>`<div class="c"><h3>${E(k)} (${r[k].length})</h3><div>${r[k].map(x=>`<span class="ch">${E(x.w)}</span>`).join('')}</div><button class="g" onclick="repBack(${i})">برگرداندن همه به لیست</button><button class="g" onclick="repClr(${i})">پاک کردن</button></div>`).join(''):'<div class="c">هنوز لغتی استفاده نشده است.</div>')}
function repBack(i){const k=repKeys()[i],L=lists();REPK()[k].forEach(x=>{const e=L.find(e=>e[2]==x.s);if(e&&!e[0].includes(x.w))e[0].push(x.w)});delete REPK()[k];save();adm()}
function repClr(i){const k=repKeys()[i];if(!confirm('لغت‌های این بخش برای همیشه پاک شوند؟'))return;delete REPK()[k];save();adm()}
function svsec6(i){cfg.sp6[i]=lines('#sw').slice(0,9);save();A.s=null;adm()}
function svsec(i){cfg.sp[i]=lines('#sw').slice(0,8);save();A.s=null;adm()}
function svs(){cfg.sent=lines('#ts');if($('#ra'))cfg.rA=lines('#ra');save();adm()}
function svp(){cfg.rP=lines('#rp');cfg.wd[5]=lines('#wl');WD();save();adm()}
function svpo(){cfg.po=lines('#po');PO8();save();adm()}
function svw(i){cfg.wd[i]=lines('#wl');WD();save();adm()}
function mv(p,j,d){const s=cfg.pre[p].s,k=j+d;if(k<0||k>=s.length)return;[s[j],s[k]]=[s[k],s[j]];save();adm()}
function rm(p,j){cfg.pre[p].s.splice(j,1);save();adm()}
function ad(p,id){cfg.pre[p].s.push(+id);save();adm()}
function dp(p){cfg.pre.splice(p,1);cfg.def=0;save();adm()}
function rs2(){try{const d=JSON.parse($('#bk').value);if(!d.cats)throw 0;d.logo=cfg.logo;cfg=d;PO8();WD();ESP6();save();adm()}catch(e){alert('متن نامعتبر است')}}
function rz(){if(!armed){armed=1;return adm()}armed=0;const l=cfg.logo;cfg=defaults();cfg.logo=l;cfg.p8=1;save();adm()}
addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.n){const v=t.value.replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776).replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632);if(v!==t.value)t.value=v}});
function route(){location.hash=='#admin'?adm():home()}
let DP=0;
['home','setup','start','hub','run','intro','begin','turn','pickCat','lvl','go','handoff','restr','rs','ready','play','draw','tog','rel','done','fin','adm'].forEach(n=>{const f=window[n];if(typeof f!='function')return;
